# The database side. The DBA created this Secret correctly (stringData, no newline).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-server-secret
  namespace: session12
type: Opaque
stringData:
  POSTGRES_USER: "yatri_admin"
  POSTGRES_PASSWORD: "secretpassword"
  POSTGRES_DB: "yatri_production_db"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-postgres
  namespace: session12
  labels:
    app: yatri-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yatri-postgres
  template:
    metadata:
      labels:
        app: yatri-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: postgres-server-secret
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "yatri_admin", "-d", "yatri_production_db"]
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: yatri-postgres
  namespace: session12
spec:
  selector:
    app: yatri-postgres
  ports:
    - port: 5432
      targetPort: 5432
