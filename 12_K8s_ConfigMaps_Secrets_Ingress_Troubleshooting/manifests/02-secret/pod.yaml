apiVersion: v1
kind: Pod
metadata:
  name: secret-demo
  namespace: session12
  labels:
    app: secret-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo started; sleep 3600"]
      # 1) single keys as env variables
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: campus-db-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: campus-db-secret
              key: DB_PASSWORD
      # 2) the whole Secret mounted as files (one file per key)
      volumeMounts:
        - name: creds
          mountPath: /etc/campus-secrets
          readOnly: true
  volumes:
    - name: creds
      secret:
        secretName: campus-db-secret
        defaultMode: 0400
