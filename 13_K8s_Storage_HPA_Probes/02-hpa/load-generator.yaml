# 3 busybox Pods that keep hitting hpa-demo-service with wget.
# Scale to 0 or delete to stop the load:
#   kubectl delete -f load-generator.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
spec:
  replicas: 3
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command: ["/bin/sh", "-c", "while true; do wget -q -O- http://hpa-demo-service > /dev/null; done"]
          resources:
            limits:
              cpu: 200m
              memory: 32Mi
