# No PV exists for this claim. The StorageClass creates one automatically.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dynamic-pvc
  namespace: session13
spec:
  storageClassName: fast-local
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 200Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: dynamic-demo
  namespace: session13
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo dynamic-ok > /data/check.txt; sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: dynamic-pvc
