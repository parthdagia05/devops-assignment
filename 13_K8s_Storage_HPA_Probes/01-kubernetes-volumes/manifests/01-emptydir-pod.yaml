# Two containers share one emptyDir. writer appends the date, reader prints it.
apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo
  namespace: session13
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "while true; do date >> /cache/log.txt; sleep 5; done"]
      volumeMounts:
        - name: shared
          mountPath: /cache
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: shared
          mountPath: /cache
  volumes:
    - name: shared
      emptyDir:
        sizeLimit: 50Mi
