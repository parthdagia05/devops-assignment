<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b42bc"/></marker>
  </defs>
  <rect width="1240" height="880" fill="#ffffff"/>
  <text x="620" y="868" font-size="12" fill="#888" text-anchor="middle">Session 19: Cloud &amp; Terraform in Action · Parth Dagia (24BCS10414) · 19 resources, region ap-south-1</text>

  <!-- Terraform side -->
  <rect x="20" y="100" width="280" height="740" rx="10" fill="#f5f0fc" stroke="#7b42bc" stroke-width="2"/>
  <text x="160" y="130" font-size="18" font-weight="bold" fill="#7b42bc" text-anchor="middle">Terraform (my Mac)</text>
  <g font-size="13" fill="#333">
    <rect x="40" y="148" width="240" height="196" rx="6" fill="#fff" stroke="#c9b3e6"/>
    <text x="52" y="170" font-weight="bold">terraform/</text>
    <text x="56" y="192">provider.tf</text><text x="150" y="192" fill="#666">aws ~&gt; 6.0, random</text>
    <text x="56" y="212">variables.tf</text><text x="150" y="212" fill="#666">typed + validated</text>
    <text x="56" y="232">terraform.tfvars</text><text x="150" y="232" fill="#666">my values</text>
    <text x="56" y="252">network.tf</text><text x="150" y="252" fill="#666">VPC, IGW, subnet, RT</text>
    <text x="56" y="272">security.tf</text><text x="150" y="272" fill="#666">SG + 3 rules</text>
    <text x="56" y="292">compute.tf</text><text x="150" y="292" fill="#666">AMI, IAM, EC2</text>
    <text x="56" y="312">storage.tf</text><text x="150" y="312" fill="#666">S3 + object</text>
    <text x="56" y="332">outputs.tf</text><text x="150" y="332" fill="#666">10 outputs</text>
  </g>
  <g font-size="14" text-anchor="middle">
    <rect x="70" y="370" width="180" height="34" rx="17" fill="#7b42bc"/><text x="160" y="392" fill="#fff">terraform init</text>
    <rect x="70" y="424" width="180" height="34" rx="17" fill="#7b42bc"/><text x="160" y="446" fill="#fff">terraform plan</text>
    <rect x="70" y="478" width="180" height="34" rx="17" fill="#7b42bc"/><text x="160" y="500" fill="#fff">terraform apply</text>
    <rect x="70" y="532" width="180" height="34" rx="17" fill="#b0306a"/><text x="160" y="554" fill="#fff">terraform destroy</text>
  </g>
  <g stroke="#7b42bc" stroke-width="1.5" marker-end="url(#b)"><line x1="160" y1="404" x2="160" y2="422"/><line x1="160" y1="458" x2="160" y2="476"/><line x1="160" y1="512" x2="160" y2="530"/></g>
  <rect x="40" y="596" width="240" height="96" rx="6" fill="#fff" stroke="#c9b3e6"/>
  <text x="160" y="620" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">terraform.tfstate</text>
  <text x="160" y="642" font-size="12" fill="#555" text-anchor="middle">maps 21 addresses -&gt; real IDs</text>
  <text x="160" y="660" font-size="12" fill="#555" text-anchor="middle">local backend (S3 backend</text>
  <text x="160" y="676" font-size="12" fill="#555" text-anchor="middle">with lockfile for teams)</text>
  <line x1="250" y1="495" x2="250" y2="594" stroke="#7b42bc" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#b)"/>
  <text x="256" y="560" font-size="11" fill="#7b42bc">writes</text>
  <rect x="40" y="712" width="240" height="108" rx="6" fill="#fff" stroke="#c9b3e6"/>
  <text x="160" y="736" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Target</text>
  <text x="160" y="758" font-size="12" fill="#555" text-anchor="middle">use_localstack = true</text>
  <text x="160" y="776" font-size="12" fill="#555" text-anchor="middle">-&gt; LocalStack 4.14 :4566</text>
  <text x="160" y="798" font-size="12" fill="#555" text-anchor="middle">false -&gt; real AWS account</text>

  <!-- provider arrow -->
  <line x1="300" y1="470" x2="350" y2="470" stroke="#7b42bc" stroke-width="3" marker-end="url(#b)"/>
  <text x="304" y="460" font-size="11" fill="#7b42bc">API</text>

  <!-- Internet -->
  <rect x="660" y="20" width="200" height="50" rx="25" fill="#eef3f8" stroke="#555"/>
  <text x="760" y="50" font-size="15" text-anchor="middle" fill="#333">Internet / users</text>

  <!-- AWS cloud + region -->
  <rect x="330" y="100" width="890" height="740" rx="10" fill="#fff" stroke="#232f3e" stroke-width="2"/>
  <text x="350" y="126" font-size="16" font-weight="bold" fill="#232f3e">AWS Cloud</text>
  <rect x="350" y="140" width="850" height="684" rx="8" fill="#fff" stroke="#00a1c9" stroke-dasharray="7 4" stroke-width="1.5"/>
  <text x="366" y="162" font-size="14" fill="#00a1c9">Region ap-south-1 (Mumbai)</text>

  <!-- VPC -->
  <rect x="370" y="200" width="560" height="604" rx="8" fill="#f2f8ec" stroke="#3f8624" stroke-width="2"/>
  <text x="386" y="252" font-size="15" font-weight="bold" fill="#3f8624">VPC  10.0.0.0/16</text>
  <text x="386" y="270" font-size="11" fill="#3f8624">DNS support + hostnames on</text>

  <!-- IGW -->
  <rect x="670" y="180" width="180" height="42" rx="6" fill="#8c4fff" stroke="#5a2ea6"/>
  <text x="760" y="206" font-size="14" fill="#fff" text-anchor="middle">Internet Gateway</text>
  <line x1="760" y1="70" x2="760" y2="178" stroke="#333" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- AZ + subnet -->
  <rect x="390" y="284" width="520" height="350" rx="6" fill="none" stroke="#00a1c9" stroke-dasharray="5 4"/>
  <text x="404" y="302" font-size="12" fill="#00a1c9">Availability Zone ap-south-1a</text>
  <rect x="410" y="312" width="480" height="306" rx="6" fill="#e6f2df" stroke="#3f8624"/>
  <text x="424" y="332" font-size="14" font-weight="bold" fill="#3f8624">Public subnet 10.0.1.0/24</text>
  <text x="424" y="349" font-size="11" fill="#3f8624">map_public_ip_on_launch = true</text>

  <!-- SG -->
  <rect x="436" y="362" width="428" height="236" rx="6" fill="#fff" stroke="#dd344c" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="450" y="382" font-size="13" font-weight="bold" fill="#dd344c">Security group  web-sg</text>
  <text x="450" y="400" font-size="12" fill="#b0283c">in tcp/80 from 0.0.0.0/0 · in tcp/22 from 203.0.113.10/32</text>
  <text x="450" y="416" font-size="12" fill="#b0283c">out: all traffic</text>

  <!-- EC2 -->
  <rect x="540" y="432" width="220" height="150" rx="8" fill="#ed7100"/>
  <text x="650" y="458" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">EC2  aws_instance.web</text>
  <g font-size="12" fill="#fff" text-anchor="middle">
    <text x="650" y="480">t3.micro · Ubuntu AMI (data source)</text>
    <text x="650" y="498">user_data: nginx + page from S3</text>
    <text x="650" y="516">public IP · IMDSv2 required</text>
    <text x="650" y="534">8 GB gp3 root, encrypted</text>
    <text x="650" y="552">instance profile -&gt; IAM role</text>
  </g>

  <!-- Route table -->
  <rect x="390" y="656" width="520" height="128" rx="6" fill="#fff" stroke="#3f8624"/>
  <text x="404" y="678" font-size="14" font-weight="bold" fill="#3f8624">Route table  public-rt</text>
  <text x="404" y="700" font-size="12" fill="#333">10.0.0.0/16  -&gt;  local</text>
  <text x="404" y="718" font-size="12" fill="#333">0.0.0.0/0     -&gt;  Internet Gateway</text>
  <text x="404" y="740" font-size="12" fill="#333">associated with the public subnet</text>
  <text x="404" y="762" font-size="11" fill="#777">(this route is what makes the subnet "public")</text>
  <line x1="880" y1="656" x2="880" y2="620" stroke="#3f8624" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M900 700 C 960 700, 960 222, 852 210" fill="none" stroke="#8c4fff" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#a)"/>

  <!-- S3 -->
  <rect x="960" y="250" width="222" height="200" rx="8" fill="#e9f5e3" stroke="#3f8624" stroke-width="2"/>
  <text x="1071" y="276" font-size="16" font-weight="bold" fill="#3f8624" text-anchor="middle">S3 bucket</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="1071" y="298">parth-s19-assets-dev-&lt;hex&gt;</text>
    <text x="1071" y="322">versioning: Enabled</text>
    <text x="1071" y="342">SSE: AES256</text>
    <text x="1071" y="362">public access: all blocked</text>
    <text x="1071" y="386" font-weight="bold">site/index.html</text>
    <text x="1071" y="408" fill="#777">random_id suffix (global names)</text>
    <text x="1071" y="426" fill="#777">force_destroy = true</text>
  </g>

  <!-- IAM -->
  <rect x="960" y="500" width="222" height="130" rx="8" fill="#fdecee" stroke="#dd344c" stroke-width="2"/>
  <text x="1071" y="526" font-size="16" font-weight="bold" fill="#dd344c" text-anchor="middle">IAM</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="1071" y="548">role  ec2-role</text>
    <text x="1071" y="566">trust: ec2.amazonaws.com</text>
    <text x="1071" y="584">policy: s3:GetObject, ListBucket</text>
    <text x="1071" y="602">on this bucket only</text>
    <text x="1071" y="620">+ instance profile</text>
  </g>

  <!-- EC2 links -->
  <path d="M760 470 C 860 470, 880 350, 958 350" fill="none" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="874" y="432" font-size="11" fill="#333">aws s3 cp</text><text x="874" y="446" font-size="11" fill="#333">at boot</text>
  <path d="M760 545 C 860 545, 880 565, 958 565" fill="none" stroke="#dd344c" stroke-width="2" marker-end="url(#a)"/>
  <text x="790" y="580" font-size="11" fill="#dd344c">assumes role</text>
  <line x1="1071" y1="498" x2="1071" y2="452" stroke="#dd344c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="1078" y="480" font-size="11" fill="#dd344c">grants read</text>
</svg>
