apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
labels:
  - pairs: { env: dev }
replicas:
  - { name: podinfo, count: 1 }
configMapGenerator:       # the hash suffix changes when the data changes, which rolls the pods
  - name: podinfo-config
    literals:
      - PODINFO_UI_MESSAGE=hello from DEV (deployed by Argo CD)
      - PODINFO_UI_COLOR=#2f6f3e
