apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  labels: { app: podinfo }
spec:
  replicas: 1
  selector: { matchLabels: { app: podinfo } }
  template:
    metadata: { labels: { app: podinfo } }
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.9.1
          command: [./podinfo, --port=9898]
          envFrom:
            - configMapRef: { name: podinfo-config }   # PODINFO_UI_MESSAGE / PODINFO_UI_COLOR
          ports: [ { name: http, containerPort: 9898 } ]
          livenessProbe:  { httpGet: { path: /healthz, port: 9898 } }
          readinessProbe: { httpGet: { path: /readyz,  port: 9898 } }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 64Mi }
