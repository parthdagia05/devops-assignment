apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo-prod
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]   # deleting the app deletes what it deployed
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc:3000/parth/gitops-demo.git
    targetRevision: main
    path: podinfo/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-prod
  syncPolicy:
    automated:
      prune: true      # delete resources that were removed from Git
      selfHeal: true   # undo manual changes made in the cluster
    syncOptions: [CreateNamespace=true]
