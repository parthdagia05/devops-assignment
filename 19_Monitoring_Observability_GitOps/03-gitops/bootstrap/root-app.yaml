# The only thing applied by hand. It points Argo CD at apps/ in the Git repo; every other
# Application (podinfo-dev, podinfo-prod) is created from Git by this one ("app of apps").
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc:3000/parth/gitops-demo.git
    targetRevision: main
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
