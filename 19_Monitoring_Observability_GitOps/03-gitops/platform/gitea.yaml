# A small in-cluster Git server (Gitea + SQLite) that plays the role of GitHub/GitLab for the demo.
# Argo CD pulls from http://gitea.gitea.svc:3000/parth/gitops-demo.git
apiVersion: v1
kind: Namespace
metadata:
  name: gitea
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
  namespace: gitea
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: gitea
  labels: { app: gitea }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: gitea } }
  template:
    metadata: { labels: { app: gitea } }
    spec:
      securityContext: { fsGroup: 1000 }
      containers:
        - name: gitea
          image: gitea/gitea:1.24.6-rootless
          env:
            - { name: GITEA__security__INSTALL_LOCK,        value: "true" }   # skip the web installer
            - { name: GITEA__database__DB_TYPE,             value: sqlite3 }
            - { name: GITEA__server__ROOT_URL,              value: "http://gitea.gitea.svc:3000/" }
            - { name: GITEA__server__DISABLE_SSH,           value: "true" }
            - { name: GITEA__service__DISABLE_REGISTRATION, value: "true" }
            - { name: GITEA__webhook__ALLOWED_HOST_LIST,    value: "*" }      # allow the webhook to Argo CD (in-cluster host)
            - { name: GITEA__repository__DEFAULT_BRANCH,    value: main }
          ports: [ { name: http, containerPort: 3000 } ]
          readinessProbe: { httpGet: { path: /api/healthz, port: 3000 } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/gitea }
            - { name: data, mountPath: /etc/gitea, subPath: config }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: gitea-data }
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: gitea
spec:
  selector: { app: gitea }
  ports: [ { name: http, port: 3000, targetPort: 3000 } ]
